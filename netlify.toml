# netlify.toml — Netlifyのビルド/配信設定

[build]
  # アドインの静的ファイル（manifest, HTML, JS）を置くフォルダ
  publish = "src"
  # サーバーレス関数の置き場所
  functions = "netlify/functions"

[functions]
  # Node.js のランタイムを ES Module として扱う
  node_bundler = "esbuild"

# 証拠抽出は処理が長いため、関数のタイムアウトを延長する（既定10秒→26秒）
[functions."evidence-list"]
  # 同期関数の最大値（秒）。長い訴状の解析でも途中で打ち切られないようにする
  timeout = 26

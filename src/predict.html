<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予測家計表の作成</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --ink: #1c2321; --paper: #f6f8f6; --accent: #2f6b4f;
      --accent-soft: #d4e4da; --line: #cdd8d1; --warn: #b4452f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      background: var(--paper); color: var(--ink);
      padding: 18px 16px 30px; font-size: 13.5px; line-height: 1.7;
    }
    .masthead { border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
    .masthead h1 { font-size: 18px; letter-spacing: .1em; font-weight: 700; }
    .masthead .sub {
      font-size: 10px; letter-spacing: .25em; color: var(--accent);
      text-transform: uppercase; margin-top: 3px;
    }
    .desc { font-size: 11.5px; color: #5a635e; margin: 14px 0 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
    .field .hint { font-size: 10.5px; color: #7a847e; margin-bottom: 6px; }
    input[type="number"], select {
      width: 100%; padding: 9px 10px; border: 1px solid var(--line);
      border-radius: 3px; font-size: 13.5px; font-family: inherit; background: #fff;
    }
    .sheets-box {
      border: 1px solid var(--line); border-radius: 3px; background: #fff;
      padding: 8px 10px; max-height: 130px; overflow-y: auto;
    }
    .sheets-box label {
      display: flex; align-items: center; gap: 8px; font-weight: 400;
      font-size: 12.5px; padding: 3px 0; cursor: pointer;
    }
    .run-btn {
      width: 100%; background: var(--ink); color: var(--paper);
      padding: 13px; font-size: 14px; letter-spacing: .15em; border: none;
      border-radius: 2px; cursor: pointer; transition: background .15s;
    }
    .run-btn:hover:not(:disabled) { background: var(--accent); }
    .run-btn:disabled { opacity: .45; cursor: default; }
    .status { font-size: 11.5px; margin: 14px 0; min-height: 18px; color: #5a635e; }
    .status.err { color: var(--warn); }
    .status.ok { color: var(--accent); }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--accent-soft); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-note {
      border-left: 3px solid var(--warn); background: #fdf4f1;
      padding: 8px 11px; margin-top: 6px; font-size: 11.5px;
    }
    .result-note b { color: var(--warn); }
  </style>
</head>
<body>
  <div class="masthead">
    <h1>予測家計表の作成</h1>
    <div class="sub">Budget Forecast for Civil Rehabilitation</div>
  </div>

  <p class="desc">
    実績の家計表シートを選ぶと、<strong>予測家計表のひな形シート</strong>に金額だけを書き込みます。
    結合セル・罫線・列幅などの様式は崩れません。
    車・持ち家などから推定される定期支出の計上漏れは「要確認」付きで補完します。
  </p>

  <div class="field">
    <label>1. 実績の家計表シートを選ぶ</label>
    <div class="hint">予測の元にする実績月のシートにチェック（複数可）</div>
    <div id="sheets" class="sheets-box">読み込み中…</div>
  </div>

  <div class="field">
    <label for="templateSheet">2. 書き込み先のひな形シート</label>
    <div class="hint">金額を書き込む予測家計表のひな形シートを選択</div>
    <select id="templateSheet"></select>
  </div>

  <div class="field">
    <label for="repayment">3. 再生計画に基づく月々の返済額</label>
    <div class="hint">円。分からなければ空欄でも可（項目だけ作成）</div>
    <input type="number" id="repayment" placeholder="例：33703" min="0" />
  </div>

  <button id="run" class="run-btn">予 測 表 を 作 成</button>

  <div id="status" class="status"></div>
  <div id="results"></div>

  <script src="predict.js"></script>
</body>
</html>

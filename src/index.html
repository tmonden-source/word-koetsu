<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本語校閲アドイン</title>
  <style>
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      background: #faf7f2; color: #1a1714;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
    }
    .card {
      max-width: 520px; background: #fff; padding: 40px 36px;
      border-top: 4px solid #b4452f; box-shadow: 0 10px 40px rgba(0,0,0,.06);
    }
    h1 { font-size: 24px; letter-spacing: .15em; margin: 0 0 6px; }
    .sub {
      font-family: "Yu Gothic", sans-serif; font-size: 11px;
      letter-spacing: .3em; color: #b4452f; text-transform: uppercase;
      margin-bottom: 22px;
    }
    p { font-family: "Yu Gothic", sans-serif; font-size: 13.5px; line-height: 1.9; color: #4a433b; }
    .ok { color: #3a6b4f; font-weight: 600; }
    code {
      background: #f2ede4; padding: 2px 7px; border-radius: 3px;
      font-size: 12px; word-break: break-all;
    }
    .note {
      margin-top: 22px; padding-top: 18px; border-top: 1px solid #e5ddd0;
      font-size: 12px; color: #8a8076;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>日本語校閲</h1>
    <div class="sub">Proofreading Add-in for Word</div>
    <p>
      <span class="ok">✓ サーバーは正常に稼働しています。</span><br />
      これはWord用アドインの配信サーバーです。このページ自体に操作はありません。
    </p>
    <p>
      校閲機能は <strong>Word</strong> の「ホーム」タブにある
      「日本語校閲」ボタンから利用します。
      Wordへの導入には設定ファイル（<code>manifest.xml</code>）が必要です。
    </p>
    <div class="note">
      動作確認用パネル: <code>/taskpane.html</code><br />
      校閲API: <code>/.netlify/functions/proofread</code>
    </div>
  </div>
</body>
</html>
